<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Página no encontrada · Josep</title>
  <style>
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:#050c22;color:#ece6d6;font:400 17px/1.6 system-ui,sans-serif;padding:24px}
    h1{font:400 clamp(2.5rem,8vw,4.5rem)/1.05 Marcellus,Georgia,serif;margin:0 0 12px;color:#e7c46a}
    p{color:#95a1c3;margin:0 0 28px;max-width:32rem}
    a{display:inline-block;background:#d6a940;color:#050c22;text-decoration:none;padding:10px 20px;border-radius:999px;font-weight:500}
    a:hover{background:#f0d68a}
  </style>
</head>
<body>
  <main>
    <h1>Esta página no existe</h1>
    <p>La dirección puede estar mal escrita o la página se ha movido. Desde el inicio llegas a todo el portfolio.</p>
    <a id="home" href="/">Ir al inicio</a>
  </main>
  <script>
    // En GitHub Pages el sitio vive en /<repo>/
    var seg = location.pathname.split('/')[1];
    if (location.hostname.endsWith('github.io') && seg) document.getElementById('home').href = '/' + seg + '/';
  </script>
</body>
</html>
